name: Sync MCP diagnostics branch

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: sync-mcp-diagnostics

jobs:
  verify:
    if: github.repository == 'qsgy-edge/pi-subagents' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      candidate: ${{ steps.merge.outputs.candidate }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: mcp-readiness-diagnostics
          fetch-depth: 0
          persist-credentials: false
      - name: Merge upstream without rewriting the tracked branch
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags https://github.com/nicobailon/pi-subagents.git refs/heads/main
          if git merge-base --is-ancestor FETCH_HEAD HEAD; then
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' merge --no-edit FETCH_HEAD
          echo "candidate=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v5
        if: steps.merge.outputs.candidate != '' || github.event_name == 'workflow_dispatch'
        with:
          node-version: 24
      - name: Verify diagnostic retention and native MCP startup
        if: steps.merge.outputs.candidate != '' || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          NODE_DISABLE_COMPILE_CACHE: '1'
        run: |
          set -euo pipefail
          git grep -qF 'MCP readiness diagnostics:' HEAD -- src/runs/shared/child-session.ts
          npm ci --ignore-scripts
          npm run typecheck
          npm install --prefix "$RUNNER_TEMP/native-pi" --no-package-lock --ignore-scripts @earendil-works/pi-coding-agent@1.6.0
          export PI_SUBAGENTS_NATIVE_PI_ROOT="$(cygpath -m "$RUNNER_TEMP/native-pi")/node_modules/@earendil-works/pi-coding-agent"
          loader=$(node -p 'require("node:url").pathToFileURL("test/support/native-peer-loader.mjs").href')
          export NODE_OPTIONS="--import=$loader"
          node --experimental-strip-types --import ./test/support/register-loader.mjs --test test/integration/in-process-child.test.ts test/integration/builtin-mcp-readiness.test.ts test/unit/child-session-scoped-dispose.test.ts
      - name: Bundle verified candidate
        if: steps.merge.outputs.candidate != ''
        shell: bash
        env:
          CANDIDATE: ${{ steps.merge.outputs.candidate }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          git update-ref refs/heads/sync-candidate "$CANDIDATE"
          git bundle create "$RUNNER_TEMP/candidate.bundle" refs/heads/sync-candidate --not refs/remotes/origin/mcp-readiness-diagnostics
      - uses: actions/upload-artifact@v4
        if: steps.merge.outputs.candidate != ''
        with:
          name: sync-candidate
          path: ${{ runner.temp }}/candidate.bundle
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: verify
    # A manual run can verify the publisher even when the branch is current.
    if: needs.verify.result == 'success' && (needs.verify.outputs.candidate != '' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: mcp-diagnostics-publish
    steps:
      - uses: actions/download-artifact@v4
        if: needs.verify.outputs.candidate != ''
        with:
          name: sync-candidate
          path: ${{ runner.temp }}/verified
      - name: Check the verified candidate against the remote branch
        if: needs.verify.outputs.candidate != ''
        shell: bash
        env:
          CANDIDATE: ${{ needs.verify.outputs.candidate }}
        run: |
          set -euo pipefail
          git init --bare "$RUNNER_TEMP/publish.git"
          cd "$RUNNER_TEMP/publish.git"
          git remote add origin https://github.com/qsgy-edge/pi-subagents.git
          git fetch --no-tags origin refs/heads/mcp-readiness-diagnostics
          previous=$(git rev-parse FETCH_HEAD)
          git fetch "$RUNNER_TEMP/verified/candidate.bundle" refs/heads/sync-candidate:refs/heads/sync-candidate
          test "$(git rev-parse refs/heads/sync-candidate)" = "$CANDIDATE"
          git merge-base --is-ancestor "$previous" "$CANDIDATE"
      - name: Create diagnostics publisher token
        id: publisher
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.MCP_DIAGNOSTICS_APP_CLIENT_ID }}
          private-key: ${{ secrets.MCP_DIAGNOSTICS_APP_PRIVATE_KEY }}
          owner: qsgy-edge
          repositories: pi-subagents
          permission-contents: write
          permission-workflows: write
      - name: Advance only the diagnostics branch
        if: needs.verify.outputs.candidate != ''
        shell: bash
        working-directory: ${{ runner.temp }}/publish.git
        env:
          GH_TOKEN: ${{ steps.publisher.outputs.token }}
        run: |
          set -euo pipefail
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' \
            push origin refs/heads/sync-candidate:refs/heads/mcp-readiness-diagnostics
